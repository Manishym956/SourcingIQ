name: sourcingiq

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sourcingiq
      POSTGRES_PASSWORD: sourcingiq
      POSTGRES_DB: sourcingiq
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sourcingiq -d sourcingiq"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - sourcingiq_pg:/var/lib/postgresql/data

volumes:
  sourcingiq_pg:
