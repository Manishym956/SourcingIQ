[project]
name = "sourcingiq-api"
version = "0.0.0"
description = "SourcingIQ API."
requires-python = ">=3.11"
dependencies = [
  "alembic==1.20.1",
  "fastapi==0.162.0",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.16.2",
  "sqlalchemy==2.1.6",
  "uvicorn==0.54.0",
  "langgraph==1.2.18",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
